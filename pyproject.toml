[project]
name = "automachine"
version = "0.1.0"
description = "Causal streaming processor for synchronous perception-to-response control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
goldin2022 = [
    "h5py>=3.11",
]
demo = [
    "gradio>=5.0",
    "plotly>=5.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
